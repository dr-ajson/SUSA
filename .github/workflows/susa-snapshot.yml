name: Susa-navet – veckovis ögonblicksbild

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: susa-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SCRIPTS: skills/susa-navet/scripts
      SCHOOL_TYPES: HS YH FHS KKU AU AUB
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Datum
        id: d
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Hämta och bygg ögonblicksbilder per skolform
        env:
          SNAPSHOT_DATE: ${{ steps.d.outputs.date }}
        run: |
          release_tags=$(gh release list --limit 100 --json tagName --jq '.[].tagName')
          for school_type in $SCHOOL_TYPES; do
            prefix=${school_type,,}
            python "$SCRIPTS/susa.py" fetch --cache "data/$prefix" --school-type "$school_type"
            previous_args=()
            previous_tag=$(awk -v prefix="susa-$prefix-" -v today="$SNAPSHOT_DATE" '
              index($0, prefix) == 1 {
                day = substr($0, length(prefix) + 1)
                if (length(day) == 10 && day < today && day > latest) latest = day
              }
              END { if (latest != "") print prefix latest }
            ' <<< "$release_tags")
            if [[ -n "$previous_tag" ]]; then
              previous_file="${prefix}_${previous_tag#susa-$prefix-}.csv.gz"
              gh release download "$previous_tag" --pattern "$previous_file" --dir "prev/$prefix"
              previous_args=(--previous "prev/$prefix/$previous_file")
            fi
            python "$SCRIPTS/snapshot.py" --school-type "$school_type" --cache "data/$prefix" \
              --out-dir "out/$prefix" --repo-dir . --date "$SNAPSHOT_DATE" "${previous_args[@]}"
          done

      - name: Publicera ögonblicksbilder
        env:
          SNAPSHOT_DATE: ${{ steps.d.outputs.date }}
        run: |
          for school_type in $SCHOOL_TYPES; do
            prefix=${school_type,,}
            tag="susa-$prefix-$SNAPSHOT_DATE"
            file="out/$prefix/${prefix}_$SNAPSHOT_DATE.csv.gz"
            notes="out/$prefix/release_notes.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$file" --clobber
              gh release edit "$tag" --notes-file "$notes"
            else
              gh release create "$tag" "$file" --title "Susa-navet $school_type $SNAPSHOT_DATE" --notes-file "$notes"
            fi
          done

      - name: Peka katalogen på det nya utbudet
        env:
          SNAPSHOT_DATE: ${{ steps.d.outputs.date }}
        run: python "$SCRIPTS/catalog.py" manifest --date "$SNAPSHOT_DATE" --out snapshots/latest.json

      - name: Committa tidsserier och ändringsrapporter
        env:
          SNAPSHOT_DATE: ${{ steps.d.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "Inget nytt att committa."
          else
            git commit -m "Susa-navet: ögonblicksbilder $SNAPSHOT_DATE"
            git pull --rebase
            git push
          fi
